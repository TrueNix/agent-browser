name: publish

# Manual trigger only — publishing is a deliberate act.
# Auth is npm Trusted Publishing (OIDC): no long-lived token, no OTP.
# The npm side of the trust lives at:
#   npmjs.com/package/@truenix/agent-browser/access → Trusted Publisher
# (GitHub Actions, TrueNix/agent-browser, workflow publish.yml, allow publish)
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # REQUIRED — npm exchanges this for a publish token
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm >= 11.6.2, the first CLI with OIDC publish support.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: offline checks + full test suite
        run: |
          for file in src/*.mjs cordis/*.mjs test/*.mjs; do
            node --check "$file"
          done
          npm test
      - name: publish with provenance
        run: npm publish --provenance --access public
